<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pfloop">
  <!--
    Pfloop mark — loop (circular economy) + bottle (Pfand).
    Brand violet #5B4FE9 · soft #EEEDFE · cap accent #F59E0B
  -->
  <defs>
    <linearGradient id="pfloopMarkBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="55%" stop-color="#5B4FE9"/>
      <stop offset="100%" stop-color="#4538C7"/>
    </linearGradient>
  </defs>
  <!-- App tile -->
  <rect width="64" height="64" rx="14" fill="url(#pfloopMarkBg)"/>
  <rect x="2" y="2" width="60" height="28" rx="12" fill="#fff" opacity="0.1"/>

  <!-- Outer loop ring -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#EEEDFE" stroke-width="3.2"
    stroke-linecap="round" stroke-dasharray="96 18" stroke-dashoffset="8"/>
  <!-- Loop arrow head (top-right of ring) -->
  <path fill="#EEEDFE" d="M46.2 18.5l5.2 1.2-2.8 4.6-2.4-5.8z"/>

  <!-- Bottle body -->
  <path
    fill="#EEEDFE"
    d="M26.5 34h11v1.8c0 .85-.55 1.55-1.3 1.85v12.2c0 1.55-1.4 2.8-3.1 2.8h-2.2c-1.7 0-3.1-1.25-3.1-2.8V37.65c-.75-.3-1.3-1-1.3-1.85V34z"
  />
  <!-- Bottle neck -->
  <rect x="29.5" y="29.8" width="5" height="4.6" rx="1.1" fill="#EEEDFE"/>
  <!-- Cap / pfand accent -->
  <rect x="28.6" y="27" width="6.8" height="3.2" rx="1" fill="#F59E0B"/>
</svg>
